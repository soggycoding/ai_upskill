<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0f172a"/>
  <defs>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid1)"/>
  
  <!-- Title / Metric Label -->
  <text x="40" y="50" fill="#94a3b8" font-family="monospace" font-size="14" letter-spacing="1">SYSTEM ARCHITECTURE: RAFT DISCRETE SIMULATION</text>
  <text x="40" y="75" fill="#38bdf8" font-family="monospace" font-size="20" font-weight="bold">Deterministic Replay Cluster (5 Nodes)</text>
  
  <!-- Cluster Nodes -->
  <g transform="translate(100, 140)">
    <!-- Node 1 (Leader) -->
    <rect x="230" y="20" width="140" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="300" y="55" fill="#f8fafc" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">Node 1 (Leader)</text>
    <text x="300" y="80" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">Term 42 | Index 1042</text>

    <!-- Node 2 -->
    <rect x="50" y="160" width="130" height="80" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="115" y="195" fill="#cbd5e1" font-family="monospace" font-size="13" text-anchor="middle">Node 2 (Follower)</text>
    <text x="115" y="218" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">MatchIndex 1042</text>

    <!-- Node 3 -->
    <rect x="235" y="160" width="130" height="80" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="300" y="195" fill="#cbd5e1" font-family="monospace" font-size="13" text-anchor="middle">Node 3 (Follower)</text>
    <text x="300" y="218" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">MatchIndex 1042</text>

    <!-- Node 4 -->
    <rect x="420" y="160" width="130" height="80" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="485" y="195" fill="#f87171" font-family="monospace" font-size="13" text-anchor="middle">Node 4 [Isolated]</text>
    <text x="485" y="218" fill="#ef4444" font-family="monospace" font-size="10" text-anchor="middle">Simulated Partition</text>
    
    <!-- Connection lines -->
    <line x1="260" y1="110" x2="150" y2="160" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="300" y1="110" x2="300" y2="160" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="340" y1="110" x2="450" y2="160" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>
  
  <text x="40" y="420" fill="#64748b" font-family="monospace" font-size="12">EVENT QUEUE: SEED=0x9FA4 · PARTITION HARNESS ACTIVE · 0 LINEARIZABILITY ANOMALIES</text>
</svg>
