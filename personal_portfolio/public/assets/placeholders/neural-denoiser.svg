<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0f172a"/>
  <defs>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid3)"/>
  
  <text x="40" y="50" fill="#94a3b8" font-family="monospace" font-size="14" letter-spacing="1">NEURAL PIPELINE: CAUSAL SPEECH ENHANCEMENT</text>
  <text x="40" y="75" fill="#f59e0b" font-family="monospace" font-size="20" font-weight="bold">Hybrid STFT Complex Masking + Causal GRU</text>
  
  <g transform="translate(60, 130)">
    <!-- Spectrogram In -->
    <rect x="10" y="40" width="130" height="150" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="75" y="75" fill="#f8fafc" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold">Audio Stream</text>
    <text x="75" y="100" fill="#f59e0b" font-family="monospace" font-size="11" text-anchor="middle">16kHz Causal STFT</text>
    <text x="75" y="130" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">20ms Frame / 10ms Hop</text>
    <text x="75" y="155" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Complex Spec Map</text>

    <!-- Conv Encoder -->
    <rect x="180" y="40" width="140" height="150" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="250" y="75" fill="#f8fafc" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold">Causal Conv Enc</text>
    <text x="250" y="100" fill="#fbbf24" font-family="monospace" font-size="11" text-anchor="middle">5-Layer Dilated</text>
    <text x="250" y="130" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Zero Future Lookahead</text>
    <text x="250" y="155" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Channel Dim: 64</text>

    <!-- Recurrent Core -->
    <rect x="360" y="40" width="140" height="150" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
    <text x="430" y="75" fill="#f8fafc" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold">Masked GRU Core</text>
    <text x="430" y="100" fill="#f472b6" font-family="monospace" font-size="11" text-anchor="middle">2-Layer Recurrent</text>
    <text x="430" y="130" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">State Memory: 256</text>
    <text x="430" y="155" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Hidden Step Sync</text>

    <!-- Decoder / Clean Out -->
    <rect x="540" y="40" width="140" height="150" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="610" y="75" fill="#f8fafc" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold">iSTFT Synthesis</text>
    <text x="610" y="100" fill="#34d399" font-family="monospace" font-size="11" text-anchor="middle">Clean Audio Stream</text>
    <text x="610" y="130" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">SNR Gain: +12.4 dB</text>
    <text x="610" y="155" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">PESQ: 3.12</text>
  </g>
  
  <text x="40" y="420" fill="#64748b" font-family="monospace" font-size="12">LATENCY PROFILE: 12.8MS TOTAL · 1.8M PARAMETERS · ONNX INT8 EDGE INFERENCE</text>
</svg>
