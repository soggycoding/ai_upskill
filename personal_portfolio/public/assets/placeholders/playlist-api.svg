<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0f172a"/>
  <defs>
    <pattern id="grid-pl" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid-pl)"/>
  
  <text x="40" y="50" fill="#94a3b8" font-family="monospace" font-size="13" letter-spacing="1">RELATIONAL SCHEMA ARCHITECTURE: NO DUPLICATION</text>
  <text x="40" y="75" fill="#38bdf8" font-family="monospace" font-size="20" font-weight="bold">FastAPI + SQLAlchemy 2.0 Many-to-Many Model</text>
  
  <g transform="translate(40, 120)">
    <!-- Playlist Entity -->
    <rect x="0" y="0" width="200" height="180" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="36" rx="8" fill="#0284c7"/>
    <text x="100" y="24" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">PLAYLIST (1)</text>
    <text x="20" y="65" fill="#cbd5e1" font-family="monospace" font-size="12">id: int [PK]</text>
    <text x="20" y="90" fill="#cbd5e1" font-family="monospace" font-size="12">name: str</text>
    <text x="20" y="115" fill="#cbd5e1" font-family="monospace" font-size="12">description: str</text>
    <text x="20" y="140" fill="#94a3b8" font-family="monospace" font-size="11">created_at: dt</text>
    <text x="20" y="160" fill="#94a3b8" font-family="monospace" font-size="11">updated_at: dt</text>

    <!-- Junction Table -->
    <rect x="260" y="15" width="200" height="150" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="260" y="15" width="200" height="36" rx="8" fill="#059669"/>
    <text x="360" y="39" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">PLAYLIST_SONG (N:M)</text>
    <text x="280" y="75" fill="#cbd5e1" font-family="monospace" font-size="12">id: int [PK]</text>
    <text x="280" y="100" fill="#38bdf8" font-family="monospace" font-size="12">playlist_id: int [FK]</text>
    <text x="280" y="125" fill="#a855f7" font-family="monospace" font-size="12">song_id: int [FK]</text>
    <text x="280" y="148" fill="#94a3b8" font-family="monospace" font-size="11">position: int</text>

    <!-- Song Entity -->
    <rect x="520" y="0" width="200" height="180" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <rect x="520" y="0" width="200" height="36" rx="8" fill="#7e22ce"/>
    <text x="620" y="24" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">SONG (1)</text>
    <text x="540" y="65" fill="#cbd5e1" font-family="monospace" font-size="12">id: int [PK]</text>
    <text x="540" y="90" fill="#cbd5e1" font-family="monospace" font-size="12">title: str</text>
    <text x="540" y="115" fill="#cbd5e1" font-family="monospace" font-size="12">artist: str</text>
    <text x="540" y="140" fill="#cbd5e1" font-family="monospace" font-size="12">duration_sec: int</text>
    <text x="540" y="160" fill="#94a3b8" font-family="monospace" font-size="11">album: str</text>

    <!-- Connector Lines -->
    <line x1="200" y1="90" x2="260" y2="90" stroke="#38bdf8" stroke-width="2"/>
    <line x1="460" y1="90" x2="520" y2="90" stroke="#a855f7" stroke-width="2"/>
  </g>
  
  <text x="40" y="380" fill="#64748b" font-family="monospace" font-size="12">PRAGMA foreign_keys=ON · CASCADE DELETION ON JUNCTION ONLY · ZERO DUPLICATE ENTITIES</text>
  <text x="40" y="405" fill="#10b981" font-family="monospace" font-size="12">✓ 100% PYTEST TEST CLIENT SUITE PASSING</text>
</svg>
