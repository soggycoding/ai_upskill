<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0f172a"/>
  <defs>
    <pattern id="grid-ops" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid-ops)"/>
  
  <text x="40" y="50" fill="#94a3b8" font-family="monospace" font-size="13" letter-spacing="1">FULL-STACK SYSTEM ARCHITECTURE</text>
  <text x="40" y="75" fill="#10b981" font-family="monospace" font-size="20" font-weight="bold">OpsTracker: Workforce Attendance &amp; Inventory Engine</text>
  
  <g transform="translate(40, 120)">
    <!-- Frontend Box -->
    <rect x="0" y="20" width="200" height="180" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="0" y="20" width="200" height="34" rx="8" fill="#0284c7"/>
    <text x="100" y="43" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">CLIENT DASHBOARD</text>
    <text x="20" y="80" fill="#cbd5e1" font-family="monospace" font-size="12">Punch Kiosk UI</text>
    <text x="20" y="105" fill="#cbd5e1" font-family="monospace" font-size="12">Live Presence Board</text>
    <text x="20" y="130" fill="#cbd5e1" font-family="monospace" font-size="12">Stock Movement Form</text>
    <text x="20" y="155" fill="#cbd5e1" font-family="monospace" font-size="12">CSV Timesheet Export</text>
    <text x="20" y="180" fill="#94a3b8" font-family="monospace" font-size="11">Vanilla ES6 + CSS3</text>

    <!-- Backend Box -->
    <rect x="270" y="0" width="220" height="220" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="270" y="0" width="220" height="34" rx="8" fill="#059669"/>
    <text x="380" y="23" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">FASTAPI SERVICE</text>
    <text x="290" y="60" fill="#38bdf8" font-family="monospace" font-size="12">/api/attendance/punch</text>
    <text x="290" y="85" fill="#38bdf8" font-family="monospace" font-size="12">/api/inventory/movement</text>
    <text x="290" y="110" fill="#cbd5e1" font-family="monospace" font-size="11">Shift Duration Math</text>
    <text x="290" y="135" fill="#fbbf24" font-family="monospace" font-size="11">Stock Underflow Guard</text>
    <text x="290" y="160" fill="#cbd5e1" font-family="monospace" font-size="11">Live Roll Call Aggregator</text>
    <text x="290" y="185" fill="#94a3b8" font-family="monospace" font-size="11">Pydantic v2 Models</text>
    <text x="290" y="205" fill="#94a3b8" font-family="monospace" font-size="11">Uvicorn Server</text>

    <!-- SQLite Box -->
    <rect x="560" y="20" width="160" height="180" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <rect x="560" y="20" width="160" height="34" rx="8" fill="#7e22ce"/>
    <text x="640" y="43" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">SQLITE DB</text>
    <text x="580" y="80" fill="#cbd5e1" font-family="monospace" font-size="12">employees</text>
    <text x="580" y="105" fill="#cbd5e1" font-family="monospace" font-size="12">attendance_logs</text>
    <text x="580" y="130" fill="#cbd5e1" font-family="monospace" font-size="12">products (SKU)</text>
    <text x="580" y="155" fill="#cbd5e1" font-family="monospace" font-size="12">inventory_audit</text>
    <text x="580" y="180" fill="#94a3b8" font-family="monospace" font-size="11">ops_system.db</text>

    <!-- Arrows -->
    <line x1="200" y1="110" x2="270" y2="110" stroke="#38bdf8" stroke-width="2"/>
    <line x1="490" y1="110" x2="560" y2="110" stroke="#10b981" stroke-width="2"/>
  </g>
  
  <text x="40" y="380" fill="#64748b" font-family="monospace" font-size="12">ATOMIC INVENTORY BALANCE VALIDATION · SHIFT LATE ARRIVAL DETECTION · 0 UNDERFLOW ERRORS</text>
  <text x="40" y="405" fill="#10b981" font-family="monospace" font-size="12">✓ LOCAL-FIRST FASTAPI RUNTIME + INTERACTIVE SWAGGER /DOCS</text>
</svg>
