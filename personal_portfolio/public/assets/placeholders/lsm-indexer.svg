<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0f172a"/>
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid2)"/>
  
  <text x="40" y="50" fill="#94a3b8" font-family="monospace" font-size="14" letter-spacing="1">ENGINE ARCHITECTURE: LSM LOG INDEXER</text>
  <text x="40" y="75" fill="#10b981" font-family="monospace" font-size="20" font-weight="bold">Zero-Copy Ingestion &amp; Compaction Pipeline</text>
  
  <g transform="translate(60, 130)">
    <!-- Memtable -->
    <rect x="20" y="30" width="160" height="180" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="100" y="65" fill="#f8fafc" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">Memtable (RAM)</text>
    <text x="100" y="90" fill="#10b981" font-family="monospace" font-size="11" text-anchor="middle">Lock-Free SkipList</text>
    <line x1="40" y1="110" x2="160" y2="110" stroke="#334155"/>
    <text x="100" y="140" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Size Cap: 64 MB</text>
    <text x="100" y="165" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Arena Allocator</text>
    <text x="100" y="190" fill="#34d399" font-family="monospace" font-size="11" text-anchor="middle">Active Ingest</text>

    <!-- Arrow -->
    <path d="M 195 120 L 255 120" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="225" y="110" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">Flush</text>

    <!-- SSTable Level 0 -->
    <rect x="270" y="30" width="180" height="180" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="360" y="65" fill="#f8fafc" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">L0 SSTables (Disk)</text>
    <text x="360" y="90" fill="#60a5fa" font-family="monospace" font-size="11" text-anchor="middle">Immutable Block File</text>
    <line x1="290" y1="110" x2="430" y2="110" stroke="#334155"/>
    <text x="360" y="140" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Bloom Filter (10 bps)</text>
    <text x="360" y="165" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Sparse Key Index</text>
    <text x="360" y="190" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">CRC32 Checksum</text>

    <!-- Arrow -->
    <path d="M 465 120 L 525 120" stroke="#3b82f6" stroke-width="2"/>
    <text x="495" y="110" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">Compact</text>

    <!-- Level 1 -->
    <rect x="540" y="30" width="160" height="180" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="620" y="65" fill="#f8fafc" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">L1 Tiered Disk</text>
    <text x="620" y="90" fill="#a78bfa" font-family="monospace" font-size="11" text-anchor="middle">Non-Overlapping</text>
    <line x1="560" y1="110" x2="680" y2="110" stroke="#334155"/>
    <text x="620" y="140" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Key-Sorted Ranges</text>
    <text x="620" y="170" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Bandwidth Throttled</text>
  </g>
  
  <text x="40" y="420" fill="#64748b" font-family="monospace" font-size="12">BENCHMARK: 185,000 OPS/SEC · P99 LATENCY &lt; 1.2MS · MEMORY USAGE: 180MB RSS</text>
</svg>
