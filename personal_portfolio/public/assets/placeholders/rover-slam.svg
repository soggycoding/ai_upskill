<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0f172a"/>
  <defs>
    <pattern id="grid4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid4)"/>
  
  <text x="40" y="50" fill="#94a3b8" font-family="monospace" font-size="14" letter-spacing="1">ROBOTICS &amp; ESTIMATION: VISUAL-INERTIAL SLAM</text>
  <text x="40" y="75" fill="#818cf8" font-family="monospace" font-size="20" font-weight="bold">Loosely-Coupled EKF &amp; Pose-Graph Loop Closure</text>
  
  <g transform="translate(60, 130)">
    <rect x="20" y="30" width="180" height="170" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="110" y="65" fill="#f8fafc" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold">Feature Tracker</text>
    <text x="110" y="90" fill="#a5b4fc" font-family="monospace" font-size="11" text-anchor="middle">ORB Keypoints (1000/frame)</text>
    <line x1="40" y1="110" x2="180" y2="110" stroke="#334155"/>
    <text x="110" y="135" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Optical Flow Match</text>
    <text x="110" y="160" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Essential Matrix RANSAC</text>

    <rect x="260" y="30" width="180" height="170" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="350" y="65" fill="#f8fafc" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold">Sensor Fusion</text>
    <text x="350" y="90" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">6-DOF IMU Pre-integration</text>
    <line x1="280" y1="110" x2="420" y2="110" stroke="#334155"/>
    <text x="350" y="135" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">High-Frequency EKF</text>
    <text x="350" y="160" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Bias Drift Correction</text>

    <rect x="500" y="30" width="180" height="170" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="590" y="65" fill="#f8fafc" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold">Loop Closure</text>
    <text x="590" y="90" fill="#34d399" font-family="monospace" font-size="11" text-anchor="middle">DBoW2 Bag of Words</text>
    <line x1="520" y1="110" x2="660" y2="110" stroke="#334155"/>
    <text x="590" y="135" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">g2o Pose Graph Opt</text>
    <text x="590" y="160" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Cumulative Drift: 1.1%</text>
  </g>
  
  <text x="40" y="420" fill="#64748b" font-family="monospace" font-size="12">TEST COURSE: 400M GPS-DENIED CORRIDOR · VELOCITY: 0.6 M/S · ROS2 NODE PIPELINE</text>
