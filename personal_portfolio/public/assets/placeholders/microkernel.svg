<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0f172a"/>
  <defs>
    <pattern id="grid5" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid5)"/>
  
  <text x="40" y="50" fill="#94a3b8" font-family="monospace" font-size="14" letter-spacing="1">SYSTEMS SECURITY: CAPABILITY-BASED MICROKERNEL</text>
  <text x="40" y="75" fill="#ec4899" font-family="monospace" font-size="20" font-weight="bold">x86_64 Preemptive Priority Scheduler &amp; Memory Isolation</text>
  
  <g transform="translate(60, 130)">
    <!-- Ring 3 User Space -->
    <rect x="20" y="20" width="660" height="100" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="350" y="45" fill="#38bdf8" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold">Ring 3: Isolated User Space Processes</text>
    
    <rect x="40" y="60" width="180" height="45" rx="4" fill="#0f172a" stroke="#475569"/>
    <text x="130" y="87" fill="#cbd5e1" font-family="monospace" font-size="11" text-anchor="middle">Task A (P1 - Realtime)</text>
    
    <rect x="260" y="60" width="180" height="45" rx="4" fill="#0f172a" stroke="#475569"/>
    <text x="350" y="87" fill="#cbd5e1" font-family="monospace" font-size="11" text-anchor="middle">Task B (P2 - Normal)</text>
    
    <rect x="480" y="60" width="180" height="45" rx="4" fill="#0f172a" stroke="#475569"/>
    <text x="570" y="87" fill="#cbd5e1" font-family="monospace" font-size="11" text-anchor="middle">Task C (P3 - Idle)</text>

    <!-- Boundary -->
    <line x1="20" y1="135" x2="680" y2="135" stroke="#ec4899" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="350" y="130" fill="#f472b6" font-family="monospace" font-size="10" text-anchor="middle">SYSCALL / SYSRET HARDWARE PRIVILEGE BOUNDARY</text>

    <!-- Ring 0 Kernel Space -->
    <rect x="20" y="150" width="660" height="90" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
    <text x="350" y="175" fill="#f472b6" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold">Ring 0: Supervisor Microkernel</text>
    
    <text x="130" y="210" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">APIC Timer (1000Hz)</text>
    <text x="350" y="210" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">CR3 Page Table Switch</text>
    <text x="570" y="210" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Capability Token Check</text>
  </g>
  
  <text x="40" y="420" fill="#64748b" font-family="monospace" font-size="12">TARGET: x86_64 BARE METAL · BOOT: MULTIBOOT2 · ZERO TRIPLE FAULTS IN 100K CYCLES</text>
</svg>
