<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0f172a"/>
  <defs>
    <pattern id="grid-py" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid-py)"/>
  
  <text x="40" y="50" fill="#94a3b8" font-family="monospace" font-size="13" letter-spacing="1">ENGINEERING METHODOLOGY &amp; RIGOROUS LEARNING PROTOCOL</text>
  <text x="40" y="75" fill="#f59e0b" font-family="monospace" font-size="20" font-weight="bold">3-Stage Algorithmic Progression &amp; Spaced Recall</text>
  
  <g transform="translate(40, 130)">
    <!-- Stage 1 -->
    <rect x="0" y="0" width="200" height="170" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="34" rx="8" fill="#0284c7"/>
    <text x="100" y="23" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">STAGE 1: BASELINE</text>
    <text x="20" y="60" fill="#cbd5e1" font-family="monospace" font-size="12">Problem Decomposition</text>
    <text x="20" y="85" fill="#cbd5e1" font-family="monospace" font-size="12">Standard Case Testing</text>
    <text x="20" y="110" fill="#cbd5e1" font-family="monospace" font-size="12">Boundary Filter Guards</text>
    <text x="20" y="135" fill="#cbd5e1" font-family="monospace" font-size="12">Return Contract Checks</text>
    <text x="20" y="155" fill="#94a3b8" font-family="monospace" font-size="11">exercise_day_XX.py</text>

    <!-- Stage 2 -->
    <rect x="260" y="0" width="200" height="170" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <rect x="260" y="0" width="200" height="34" rx="8" fill="#7e22ce"/>
    <text x="360" y="23" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">STAGE 2: ALTERNATIVE</text>
    <text x="280" y="60" fill="#cbd5e1" font-family="monospace" font-size="12">Time/Space Big-O Math</text>
    <text x="280" y="85" fill="#cbd5e1" font-family="monospace" font-size="12">Stress-Test Invariants</text>
    <text x="280" y="110" fill="#cbd5e1" font-family="monospace" font-size="12">Trade-Off Analysis</text>
    <text x="280" y="135" fill="#cbd5e1" font-family="monospace" font-size="12">Refactoring Anti-Patterns</text>
    <text x="280" y="155" fill="#94a3b8" font-family="monospace" font-size="11">alternative_dayXX.py</text>

    <!-- Stage 3 -->
    <rect x="520" y="0" width="200" height="170" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="520" y="0" width="200" height="34" rx="8" fill="#059669"/>
    <text x="620" y="23" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">STAGE 3: PURE RECALL</text>
    <text x="540" y="60" fill="#cbd5e1" font-family="monospace" font-size="12">Zero-Reference Recall</text>
    <text x="540" y="85" fill="#cbd5e1" font-family="monospace" font-size="12">Mental Compiler Trace</text>
    <text x="540" y="110" fill="#cbd5e1" font-family="monospace" font-size="12">Batched Level Retrieval</text>
    <text x="540" y="135" fill="#cbd5e1" font-family="monospace" font-size="12">Adversarial Trap Tests</text>
    <text x="540" y="155" fill="#94a3b8" font-family="monospace" font-size="11">recall_day_XX.py</text>

    <!-- Flow Arrows -->
    <line x1="200" y1="85" x2="260" y2="85" stroke="#38bdf8" stroke-width="2"/>
    <line x1="460" y1="85" x2="520" y2="85" stroke="#a855f7" stroke-width="2"/>
  </g>
  
  <text x="40" y="370" fill="#64748b" font-family="monospace" font-size="12">3-POINT ADVERSARIAL TEST MATRIX: [STANDARD CASE] · [BOUNDARY CASE] · [TRAP CASE]</text>
  <text x="40" y="395" fill="#f59e0b" font-family="monospace" font-size="12">LONG-TERM MEMORY RETENTION PROTOCOL · ZERO CODE COPY SHORTCUTS</text>
</svg>
