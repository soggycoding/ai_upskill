<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0f172a"/>
  <defs>
    <pattern id="grid-port" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid-port)"/>
  
  <text x="40" y="50" fill="#94a3b8" font-family="monospace" font-size="13" letter-spacing="1">ZERO-DEPENDENCY SYSTEM ARCHITECTURE</text>
  <text x="40" y="75" fill="#38bdf8" font-family="monospace" font-size="20" font-weight="bold">Native Node.js HTTP Server &amp; Diagnostics Engine</text>
  
  <g transform="translate(40, 120)">
    <!-- Public Web Layer -->
    <rect x="0" y="20" width="190" height="180" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="0" y="20" width="190" height="34" rx="8" fill="#0284c7"/>
    <text x="95" y="43" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">PUBLIC CLIENT</text>
    <text x="20" y="80" fill="#cbd5e1" font-family="monospace" font-size="11">Minimal Dark/Light UI</text>
    <text x="20" y="105" fill="#cbd5e1" font-family="monospace" font-size="11">Executive Briefing Views</text>
    <text x="20" y="130" fill="#cbd5e1" font-family="monospace" font-size="11">Printable Resume (/cv)</text>
    <text x="20" y="155" fill="#cbd5e1" font-family="monospace" font-size="11">Zero CDN Dependencies</text>
    <text x="20" y="180" fill="#94a3b8" font-family="monospace" font-size="10">Vanilla JS · CSS Tokens</text>

    <!-- Core Native Server -->
    <rect x="250" y="0" width="220" height="220" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="250" y="0" width="220" height="34" rx="8" fill="#059669"/>
    <text x="360" y="23" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">NODE.JS CORE SERVER</text>
    <text x="270" y="60" fill="#38bdf8" font-family="monospace" font-size="11">127.0.0.1:3000 Binding</text>
    <text x="270" y="85" fill="#fbbf24" font-family="monospace" font-size="11">Traversal Guard (403)</text>
    <text x="270" y="110" fill="#a855f7" font-family="monospace" font-size="11">Timing-Safe SHA-256 Auth</text>
    <text x="270" y="135" fill="#10b981" font-family="monospace" font-size="11">56-Rule Diagnostics API</text>
    <text x="270" y="160" fill="#cbd5e1" font-family="monospace" font-size="11">Atomic File Snapshots</text>
    <text x="270" y="185" fill="#94a3b8" font-family="monospace" font-size="10">Strict HttpOnly Cookies</text>
    <text x="270" y="205" fill="#94a3b8" font-family="monospace" font-size="10">Zero NPM Packages</text>

    <!-- Isolated Storage -->
    <rect x="530" y="20" width="190" height="180" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="530" y="20" width="190" height="34" rx="8" fill="#b91c1c"/>
    <text x="625" y="43" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">STORAGE &amp; VAULT</text>
    <text x="550" y="80" fill="#cbd5e1" font-family="monospace" font-size="11">portfolio.json</text>
    <text x="550" y="105" fill="#cbd5e1" font-family="monospace" font-size="11">content/history/ (v1..vN)</text>
    <text x="550" y="130" fill="#f87171" font-family="monospace" font-size="11">private/ (Blocked 403)</text>
    <text x="550" y="155" fill="#f87171" font-family="monospace" font-size="11">portfolio_private_vault/</text>
    <text x="550" y="180" fill="#94a3b8" font-family="monospace" font-size="10">Multi-Tier .gitignore</text>

    <!-- Flow Lines -->
    <line x1="190" y1="110" x2="250" y2="110" stroke="#38bdf8" stroke-width="2"/>
    <line x1="470" y1="110" x2="530" y2="110" stroke="#10b981" stroke-width="2"/>
  </g>
  
  <text x="40" y="380" fill="#64748b" font-family="monospace" font-size="12">SECURITY PERIMETER: ZERO CDN LEAKS · REVERSE TRAVERSAL PROOF · ATOMIC JSON WRITE CYCLES</text>
  <text x="40" y="405" fill="#10b981" font-family="monospace" font-size="12">✓ 100% HEALTH AUDIT PASS (56/56 CHECKS) · 7/7 SECURITY HARNESS VERIFIED</text>
</svg>
