<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume / CV — Jethro Navarro</title>
  <meta name="description" content="Printable Resume / CV generated from portfolio data.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/cv.css">
  <script src="/js/theme.js"></script>
</head>
<body class="cv-body">
  <!-- Action Bar -->
  <div class="cv-action-bar" role="toolbar" aria-label="CV Controls">
    <a href="/" class="btn btn-outline btn-sm">← Back to Portfolio</a>
    
    <div style="display: flex; gap: 10px; align-items: center;">
      <button id="theme-toggle" class="btn-icon" aria-label="Switch theme"></button>
      <button onclick="window.print()" class="btn btn-primary btn-sm" aria-label="Print or save as PDF">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
        <span>Print / Save PDF</span>
      </button>
    </div>
  </div>

  <!-- Document Paper Container -->
  <main class="cv-paper" id="cv-paper" role="main">
    <div id="cv-loading" style="text-align: center; padding: 60px; color: var(--cv-muted); font-family: monospace;">
      Loading resume...
    </div>

    <div id="cv-content" style="display: none;">
      <!-- Header -->
      <header class="cv-header">
        <h1 class="cv-name" id="cv-name">Jethro Navarro</h1>
        <div class="cv-identity" id="cv-identity">Software &amp; Systems Developer</div>
        <div class="cv-contact-row" id="cv-contact">
          <!-- Populated dynamically -->
        </div>
      </header>

      <!-- Summary -->
      <section class="cv-section" id="cv-sec-summary">
        <h2 class="cv-section-title">Summary</h2>
        <p id="cv-summary" class="cv-item-desc" style="color: var(--cv-text); font-size: 0.92rem; line-height: 1.55;"></p>
      </section>

      <!-- Experience -->
      <section class="cv-section" id="cv-sec-experience">
        <h2 class="cv-section-title">Experience</h2>
        <div id="cv-experience-list">
          <!-- Populated dynamically -->
        </div>
      </section>

      <!-- Projects -->
      <section class="cv-section" id="cv-sec-projects">
        <h2 class="cv-section-title">Projects</h2>
        <div id="cv-projects-list">
          <!-- Populated dynamically -->
        </div>
      </section>

      <!-- Skills -->
      <section class="cv-section" id="cv-sec-capabilities">
        <h2 class="cv-section-title">Skills &amp; Technologies</h2>
        <div class="cv-skills-grid" id="cv-skills-grid">
          <!-- Populated dynamically -->
        </div>
      </section>

      <!-- Education -->
      <section class="cv-section" id="cv-sec-education">
        <h2 class="cv-section-title">Education</h2>
        <div id="cv-education-list">
          <!-- Populated dynamically -->
        </div>
      </section>

      <!-- Certifications -->
      <section class="cv-section" id="cv-sec-certs">
        <h2 class="cv-section-title">Certifications</h2>
        <div id="cv-certs-list">
          <!-- Populated dynamically -->
        </div>
      </section>
    </div>
  </main>

  <script>
    async function loadCvData() {
      try {
        const res = await fetch('/api/content');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        renderCv(data);
        document.getElementById('cv-loading').style.display = 'none';
        document.getElementById('cv-content').style.display = 'block';
        if (data.profile && data.profile.name) {
          document.title = `Resume — ${data.profile.name}`;
        }
      } catch (err) {
        document.getElementById('cv-loading').innerHTML = `<p style="color: #ef4444;">Failed to load resume data: ${err.message}</p>`;
      }
    }

    function renderCv(data) {
      const p = data.profile || {};

      // Header
      document.getElementById('cv-name').textContent = p.name || 'Jethro Navarro';
      document.getElementById('cv-identity').textContent = p.identity || 'Software & Systems Developer';

      const contactItems = [];
      if (p.email) contactItems.push(`<span>${escapeHtml(p.email)}</span>`);
      if (p.location) contactItems.push(`<span>${escapeHtml(p.location)}</span>`);
      if (p.links && p.links.github) contactItems.push(`<span>github.com/soggycoding</span>`);
      document.getElementById('cv-contact').innerHTML = contactItems.join(' · ');

      // Summary
      const summaryElem = document.getElementById('cv-summary');
      if (p.shortIntro || p.fullBio) {
        summaryElem.textContent = p.shortIntro || p.fullBio;
      } else {
        document.getElementById('cv-sec-summary').style.display = 'none';
      }

      // Experience
      const expList = document.getElementById('cv-experience-list');
      const experience = data.experience || [];
      if (experience.length) {
        expList.innerHTML = experience.map(exp => `
          <div class="cv-item">
            <div class="cv-item-header">
              <span class="cv-item-title">${escapeHtml(exp.role)}</span>
              <span class="cv-item-meta">${escapeHtml(exp.period)}</span>
            </div>
            <div class="cv-item-sub">${escapeHtml(exp.organization)} · ${escapeHtml(exp.location || '')}</div>
            <p class="cv-item-desc">${escapeHtml(exp.description)}</p>
            ${exp.highlights && exp.highlights.length ? `
              <ul class="cv-bullets">
                ${exp.highlights.map(h => `<li>${escapeHtml(h)}</li>`).join('')}
              </ul>
            ` : ''}
          </div>
        `).join('');
      } else {
        document.getElementById('cv-sec-experience').style.display = 'none';
      }

      // Projects
      const projList = document.getElementById('cv-projects-list');
      const projects = data.projects || [];
      if (projects.length) {
        projList.innerHTML = projects.slice(0, 4).map(proj => `
          <div class="cv-item">
            <div class="cv-item-header">
              <span class="cv-item-title">${escapeHtml(proj.title)}</span>
              <span class="cv-item-meta">${proj.year || ''}</span>
            </div>
            <div class="cv-item-sub">${escapeHtml(proj.role || 'Developer')} · ${(proj.technologies || []).join(', ')}</div>
            <p class="cv-item-desc">${escapeHtml(proj.shortDescription || '')}</p>
            ${proj.contribution ? `
              <p class="cv-item-desc" style="font-size: 0.84rem; color: #0284c7;">
                <strong>Contribution:</strong> ${escapeHtml(proj.contribution)}
              </p>
            ` : ''}
          </div>
        `).join('');
      } else {
        document.getElementById('cv-sec-projects').style.display = 'none';
      }

      // Skills
      const capGrid = document.getElementById('cv-skills-grid');
      const caps = (data.profile && data.profile.capabilities) || [];
      if (caps.length) {
        capGrid.innerHTML = caps.map(c => `
          <div class="cv-skill-group">
            <h4>${escapeHtml(c.category)}</h4>
            <p>${(c.items || []).join(', ')}</p>
          </div>
        `).join('');
      } else {
        document.getElementById('cv-sec-capabilities').style.display = 'none';
      }

      // Education
      const eduList = document.getElementById('cv-education-list');
      const education = data.education || [];
      if (education.length) {
        eduList.innerHTML = education.map(edu => `
          <div class="cv-item">
            <div class="cv-item-header">
              <span class="cv-item-title">${escapeHtml(edu.degree)}</span>
              <span class="cv-item-meta">${escapeHtml(edu.period)}</span>
            </div>
            <div class="cv-item-sub">${escapeHtml(edu.institution)} · ${escapeHtml(edu.location || '')}</div>
            ${edu.focus ? `<div class="cv-item-desc"><strong>Focus:</strong> ${escapeHtml(edu.focus)}</div>` : ''}
            ${edu.honors ? `<div class="cv-item-desc" style="color: #0369a1;"><strong>Honors:</strong> ${escapeHtml(edu.honors)}</div>` : ''}
          </div>
        `).join('');
      } else {
        document.getElementById('cv-sec-education').style.display = 'none';
      }

      // Certifications
      const certList = document.getElementById('cv-certs-list');
      const certs = data.certifications || [];
      if (certs.length) {
        certList.innerHTML = certs.map(cert => `
          <div class="cv-item" style="margin-bottom: 6px;">
            <span class="cv-item-title">${escapeHtml(cert.title)}</span> —
            <span class="cv-item-desc">${escapeHtml(cert.issuer)} (${cert.year || ''})</span>
          </div>
        `).join('');
      } else {
        document.getElementById('cv-sec-certs').style.display = 'none';
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    document.addEventListener('DOMContentLoaded', loadCvData);
  </script>
</body>
</html>
